<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Media Formats</title>
<link rel="stylesheet" href="style.css">
<script src="$WEBAPIS/webapis/webapis.js"></script>
</head>
<body>
  <section id="actions" class="panel">
    <h1>Media Formats</h1>
    <p class="hint">Arrows move, Enter runs. Each action prints what the Engine did; the simulator's Diagnostics say when a TV would play it.</p>
    <div id="buttons"></div>
  </section>
  <section id="types" class="panel">
    <h2>What this Engine says</h2>
    <table>
      <thead><tr><th>Type</th><th>canPlayType</th><th>MSE</th></tr></thead>
      <tbody id="typeRows"></tbody>
    </table>
  </section>
  <section id="player" class="panel">
    <h2>&lt;video&gt;</h2>
    <video id="video" muted></video>
  </section>
  <!-- AVPlay's video shows through here, behind the page. -->
  <div id="avplayLabel">AVPlay (behind the page)</div>
  <script src="main.js"></script>
</body>
</html>
