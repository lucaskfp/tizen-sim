name: Release

# A `v<version>` tag builds the GUI's installers and the CLI's archives for
# Windows and Linux, and attaches them to a draft GitHub release with
# generated notes. Publishing the draft is left to a person.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The tag names the version every crate and the GUI's installers carry.
      - name: Tag matches the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for file in crates/*/Cargo.toml; do
            grep -q "^version = \"$version\"" "$file" || { echo "::error::$file is not $version"; exit 1; }
          done
          grep -q "\"version\": \"$version\"" crates/tizen-sim-gui/tauri.conf.json \
            || { echo "::error::tauri.conf.json is not $version"; exit 1; }
      - run: gh release create "$GITHUB_REF_NAME" --draft --generate-notes --title "tizen-sim ${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis msi
            platform: windows-x64
          # The oldest supported Ubuntu, so the binaries run on older glibc.
          - os: ubuntu-22.04
            bundles: appimage deb
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/tizen-sim-gui/package-lock.json
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
        working-directory: crates/tizen-sim-gui
      - name: GUI installers
        run: npx tauri build --bundles ${{ matrix.bundles }}
        working-directory: crates/tizen-sim-gui
      - name: CLI archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo build --release -p tizen-sim
          name="tizen-sim-cli-$version-${{ matrix.platform }}"
          mkdir -p "dist/$name"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/release/tizen-sim.exe "dist/$name/"
            (cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null)
          else
            cp target/release/tizen-sim "dist/$name/"
            tar -czf "dist/$name.tar.gz" -C dist "$name"
          fi
      - name: Attach to the draft
        run: |
          shopt -s nullglob
          gh release upload "$GITHUB_REF_NAME" --clobber \
            target/release/bundle/nsis/*.exe \
            target/release/bundle/msi/*.msi \
            target/release/bundle/appimage/*.AppImage \
            target/release/bundle/deb/*.deb \
            dist/*.zip dist/*.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}
