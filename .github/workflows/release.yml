name: Release

# Builds the GUI's installers and the CLI's archives for Windows and Linux
# for a `v<version>` tag, and attaches them to that tag's draft GitHub
# release. release-please calls it once it has drafted a release (see
# release-please.yml); a tag pushed by hand runs it too, and gets a draft
# with generated notes. Publishing the draft is left to a person, and is
# what offers the release to the GUI's updater (latest.json).

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: The release's tag, e.g. v0.2.0.
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GH_REPO: ${{ github.repository }}
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      # The tag names the version every crate and the GUI's installers carry.
      - name: Tag matches the version
        run: |
          version="${TAG#v}"
          for file in crates/*/Cargo.toml; do
            grep -q "^version = \"$version\"" "$file" || { echo "::error::$file is not $version"; exit 1; }
          done
          grep -q "\"version\": \"$version\"" crates/tizen-sim-gui/tauri.conf.json \
            || { echo "::error::tauri.conf.json is not $version"; exit 1; }
      # release-please drafts its own, with the changelog as notes.
      - name: Draft the release
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --draft --generate-notes --title "tizen-sim ${TAG#v}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis msi
            platform: windows-x64
          # The oldest supported Ubuntu, so the binaries run on older glibc.
          - os: ubuntu-22.04
            bundles: appimage deb
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/tizen-sim-gui/package-lock.json
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
        working-directory: crates/tizen-sim-gui
      # Each installer is signed for the GUI's updater (`.sig` next to it),
      # with the key only CI and the maintainer hold.
      - name: GUI installers
        run: npx tauri build --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":true}}'
        working-directory: crates/tizen-sim-gui
        env:
          # Without a password: `tauri build` (2.12) doesn't take the one
          # `signer generate -p` set, and the secret is what protects it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      - name: CLI archive
        run: |
          version="${TAG#v}"
          cargo build --release -p tizen-sim
          name="tizen-sim-cli-$version-${{ matrix.platform }}"
          mkdir -p "dist/$name"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/release/tizen-sim.exe "dist/$name/"
            (cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null)
          else
            cp target/release/tizen-sim "dist/$name/"
            tar -czf "dist/$name.tar.gz" -C dist "$name"
          fi
      - name: Attach to the draft
        run: |
          shopt -s nullglob
          gh release upload "$TAG" --clobber \
            target/release/bundle/nsis/*.exe target/release/bundle/nsis/*.sig \
            target/release/bundle/msi/*.msi target/release/bundle/msi/*.sig \
            target/release/bundle/appimage/*.AppImage target/release/bundle/appimage/*.sig \
            target/release/bundle/deb/*.deb target/release/bundle/deb/*.sig \
            dist/*.zip dist/*.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}

  # The GUI's updater reads latest.json from the latest published release,
  # so a draft is offered to nobody until it is published.
  updater-manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Attach latest.json to the draft
        run: |
          mkdir -p signatures
          gh release download "$TAG" --pattern '*.sig' --dir signatures
          gh release view "$TAG" --json body --jq .body > notes.md
          .github/scripts/updater-manifest.sh "$TAG" "$GH_REPO" signatures notes.md > latest.json
          gh release upload "$TAG" --clobber latest.json
        env:
          GH_TOKEN: ${{ github.token }}
