name: CI

on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the repo (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint (${{ matrix.os }})
    strategy:
      matrix:
        # Platform-specific code (Job Objects, PDEATHSIG) only compiles on its own OS.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The GUI's Tauri webview (WebKitGTK) and its build dependencies.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The GUI's Tauri webview (WebKitGTK) and its build dependencies, and
      # Xvfb for Engines drawing on a virtual display.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      # Engines are large; download them once per Engine Manifest change.
      - uses: actions/cache@v4
        with:
          path: ~/.tizen-sim/engines
          key: engines-${{ runner.os }}-${{ hashFiles('crates/tizen-sim-core/data/engines.toml') }}
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox needs.
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: cargo test --workspace
      # The GUI's Session control with Engines in windows: on Linux each
      # keeps its own (ADR-0006), on a virtual display.
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" cargo test -p tizen-sim-gui --test controller
        env:
          TIZEN_SIM_TEST_HEADED: "1"
      # The Session suite again on the oldest Version Profile's Engine (M47).
      # Its Linux build runs in `test-m47-linux`.
      - if: runner.os == 'Windows'
        run: cargo test -p tizen-sim-core
        env:
          TIZEN_SIM_TEST_PROFILE: "3.0"
      # M47's window embedded in the GUI (#59).
      - if: runner.os == 'Windows'
        run: cargo test -p tizen-sim-gui --test embedding
        env:
          TIZEN_SIM_TEST_PROFILE: "3.0"

  # The Session suite on the M47 Linux Engine, which links GConf: Ubuntu
  # dropped it in 24.04, so this runs on 22.04 (docs/linux.md).
  test-m47-linux:
    name: test (ubuntu-22.04, Tizen 3.0)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: ~/.tizen-sim/engines
          key: engines-${{ runner.os }}-3.0-${{ hashFiles('crates/tizen-sim-core/data/engines.toml') }}
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgtk2.0-0 libgconf-2-4 libdbus-glib-1-2
      - run: cargo test -p tizen-sim-core
        env:
          TIZEN_SIM_TEST_PROFILE: "3.0"

  # The real GUI on Linux: the release build starts and its window comes up
  # on WebKitGTK. Its behaviour is tested in `test` and `gui`.
  gui-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/tizen-sim-gui/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb x11-utils
      - run: npm ci
        working-directory: crates/tizen-sim-gui
      - run: npx tauri build --no-bundle
        working-directory: crates/tizen-sim-gui
      - run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" .github/scripts/gui-starts.sh target/release/tizen-sim-gui

  shims:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shims
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: shims/package-lock.json
      - run: npm ci
      - run: npm run build
      # The core embeds the committed bundle, so it must match the sources.
      - name: Committed bundle is up to date
        run: git diff --exit-code -- dist/
      - run: npm run check-es5

  # The GUI frontend: typecheck, production build and smoke tests against a
  # stand-in Tauri backend. The Rust side's tests run in `test`.
  gui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/tizen-sim-gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/tizen-sim-gui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  # Dependencies: RustSec advisories, licenses compatible with MIT OR
  # Apache-2.0, crates.io only (deny.toml).
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
