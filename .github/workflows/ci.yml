name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint (${{ matrix.os }})
    strategy:
      matrix:
        # Platform-specific code (Job Objects, PDEATHSIG) only compiles on its own OS.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The GUI's Tauri webview (WebKitGTK) and its build dependencies.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The GUI's Tauri webview (WebKitGTK) and its build dependencies.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      # Engines are large; download them once per Engine Manifest change.
      - uses: actions/cache@v4
        with:
          path: ~/.tizen-sim/engines
          key: engines-${{ runner.os }}-${{ hashFiles('crates/tizen-sim-core/data/engines.toml') }}
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox needs.
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: cargo test --workspace
      # The Session suite again on the oldest Version Profile's Engine (M47),
      # which only has a Windows build in the Engine Manifest.
      - if: runner.os == 'Windows'
        run: cargo test -p tizen-sim-core
        env:
          TIZEN_SIM_TEST_PROFILE: "3.0"

  shims:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shims
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: shims/package-lock.json
      - run: npm ci
      - run: npm run build
      # The core embeds the committed bundle, so it must match the sources.
      - name: Committed bundle is up to date
        run: git diff --exit-code -- dist/
      - run: npm run check-es5

  # The GUI frontend: typecheck, production build and smoke tests against a
  # stand-in Tauri backend. The Rust side's tests run in `test`.
  gui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/tizen-sim-gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/tizen-sim-gui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
