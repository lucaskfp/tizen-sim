name: CI

on:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  hang:
    name: hang (${{ matrix.scope }})
    strategy:
      fail-fast: false
      matrix:
        scope: [avplay-nosandbox]
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - uses: actions/cache@v6
        with:
          path: ~/.tizen-sim/engines
          key: engines-${{ runner.os }}-${{ hashFiles('crates/tizen-sim-core/data/engines.toml') }}
      - shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - if: matrix.scope == 'probe'
        shell: pwsh
        run: .github/scripts/probe-m47.ps1
      - if: matrix.scope == 'avplay-nosandbox'
        shell: pwsh
        run: |
          $f = 'crates/tizen-sim-core/data/engines.toml'
          $t = Get-Content $f -Raw
          $r = [regex]'(?m)^gpu_compositing = false'
          Set-Content $f $r.Replace($t, "gpu_compositing = false`nsandbox = false", 1) -NoNewline
          Get-Content $f | Select-Object -Skip 17 -First 11
      - if: matrix.scope == 'avplay-nosandbox'
        run: cargo test -p tizen-sim-core --no-run
      - if: matrix.scope == 'avplay-nosandbox'
        shell: pwsh
        env:
          TIZEN_SIM_TEST_PROFILE: "3.0"
          SCOPE: avplay
        run: .github/scripts/hang-watchdog.ps1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hang-${{ matrix.scope }}
          path: hang-out
