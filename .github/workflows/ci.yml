name: CI

on:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  hang:
    name: hang (${{ matrix.scope }})
    strategy:
      fail-fast: false
      matrix:
        scope: [stack]
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - uses: actions/cache@v6
        with:
          path: ~/.tizen-sim/engines
          key: engines-${{ runner.os }}-${{ hashFiles('crates/tizen-sim-core/data/engines.toml') }}
      - shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - shell: pwsh
        run: .github/scripts/stack-m47.ps1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hang-${{ matrix.scope }}
          path: hang-out
