name: PR title

# Pull requests are squash-merged, so the title becomes the commit on main:
# it must be a Conventional Commit (CONTRIBUTING.md). release-please reads
# these to pick the next version and write the changelog.
#
# `pull_request_target` so it also runs, read-only, on pull requests from
# forks. It never checks out their code: it only reads the title.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    name: conventional title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            docs
            ci
            build
            test
            refactor
            perf
            chore
            revert
          requireScope: false
