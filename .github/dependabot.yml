# Weekly dependency updates, grouped so each ecosystem opens one pull
# request for its minor and patch bumps. Security updates come on their own.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directories: [/crates/tizen-sim-gui, /shims]
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
