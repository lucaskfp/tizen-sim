<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Network fixture</title>
</head>
<body>
<script>
  // Requests `url` with XHR and passes what happened to `done`.
  window.request = function (method, url, done) {
    var xhr = new XMLHttpRequest();
    xhr.open(method, url);
    xhr.onload = function () { done({ loaded: true, status: xhr.status, body: xhr.responseText }); };
    xhr.onerror = function () { done({ loaded: false, status: xhr.status }); };
    xhr.send();
  };
  window.inlineScriptRan = true;
</script>
</body>
</html>
