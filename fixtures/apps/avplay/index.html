<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AVPlay fixture</title>
    <script type="text/javascript" src="$WEBAPIS/webapis/webapis.js"></script>
    <style>
        body { margin: 0; }
        #cover { position: absolute; left: 1700px; top: 900px; width: 220px; height: 180px; background: #f00; }
    </style>
    <script>
        // Every AVPlayPlaybackCallback call, in order, as [name, ...arguments].
        window.avEvents = [];
        window.recordEvents = function () {
            var names = ['onbufferingstart', 'onbufferingprogress', 'onbufferingcomplete',
                'oncurrentplaytime', 'onstreamcompleted', 'onevent', 'onerror', 'onerrormsg'];
            var listener = {};
            names.forEach(function (name) {
                listener[name] = function () {
                    window.avEvents.push([name].concat(Array.prototype.slice.call(arguments)));
                };
            });
            webapis.avplay.setListener(listener);
        };
        window.mediaUrl = function (name) {
            return location.href.replace(/[^\/]*$/, '') + 'media/' + name;
        };
    </script>
</head>
<body>
    <div id="cover"></div>
</body>
</html>
