[package]
name = "tizen-sim-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
dirs = "7.0.0"
futures-util = "0.3.34"
hex = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tokio-tungstenite = "0.30.0"
toml = "1.1.8"
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
zip = "9.0.0"

[dev-dependencies]
axum = "0.8.9"
futures-util = "0.3.34"
hex = "0.4.3"
sha2 = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["full"] }
zip = "9.0.0"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target."cfg(unix)".dependencies]
libc = "0.2.190"
