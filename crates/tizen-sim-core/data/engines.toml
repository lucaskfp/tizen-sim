# Tizen 4.0 to 8.0: snapshots of the trunk revision where each milestone
# branched (Chromium 108.0.5359.0 for 8.0, down to 56.0.2924.0 for 4.0), or
# the nearest one archived below it, all 64-bit. Each platform keeps its own
# revisions, so the two may differ by a few.
#
# Before M109, `--headless` is Chromium's old headless browser. Its window
# never minimizes, so a hidden App still sees itself visible: these Engines
# count as having no headless mode, and a headless Session runs them in a
# window off the screen (measured on M63-M108 on Windows; M56 has no
# headless mode at all).
#
# Linux: under Chromium's sandbox, M56 to M85 never open a page (no page
# target, renderers don't start; measured on Debian 13), so they run
# without it. From M94 on the namespace sandbox works without a setuid
# helper. M56 and M63 link GConf (docs/linux.md), M56 GTK 2 and M63 GTK 3.
[[engine]]
profile = "8.0"
milestone = 108
platform = "windows-x64"
url = "https://storage.googleapis.com/chromium-browser-snapshots/Win_x64/1058931/chrome-win.zip"
sha256 = "b08b33bc955b486005c8853d83c1beeace0c5ac3c556b2c4762941ce2c5feaef"
executable = "chrome-win/chrome.exe"
headless = false

[[engine]]
