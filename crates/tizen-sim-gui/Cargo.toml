[package]
name = "tizen-sim-gui"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "tizen_sim_gui"

[[bin]]
name = "tizen-sim-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
# `generate_context!` builds the plugins' configuration with it.
serde_json = "1.0.151"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-dialog = "2.8.2"
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.13.3"
thiserror = "2.0.21"
tizen-sim-core = { path = "../tizen-sim-core" }
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
png = "0.18.0"
tauri = { version = "2.12.3", features = ["test"] }
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["full"] }

[features]
# `tauri build` turns this on to serve the built frontend instead of the
# Vite dev server.
custom-protocol = ["tauri/custom-protocol"]
