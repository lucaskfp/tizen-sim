[workspace]
resolver = "3"
# Listed one by one: release-please bumps each member's version and reads
# `members` literally, so a glob would be skipped.
members = ["crates/tizen-sim-cli", "crates/tizen-sim-core", "crates/tizen-sim-gui"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lucaskfp/tizen-sim"
publish = false
